<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Plant Leaf and Venation">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="16" fill="#f8fafc"/>

  <!-- Petiole (Leaf Stalk) -->
  <path d="M 35 175 Q 60 160, 85 135" stroke="#16a34a" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Leaf Blade (Lamina) -->
  <path d="M 75 145 C 40 100, 50 35, 165 25 C 160 115, 120 165, 75 145 Z" fill="url(#leafGrad)" stroke="#166534" stroke-width="2"/>

  <!-- Midrib (Primary Vein) -->
  <path d="M 75 145 Q 115 105, 165 25" stroke="#86efac" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Secondary Veins (Left side of midrib) -->
  <path d="M 92 128 Q 75 110, 68 85" stroke="#bbf7d0" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 112 108 Q 95 90, 85 62" stroke="#bbf7d0" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 132 82 Q 120 65, 110 42" stroke="#bbf7d0" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 148 55 Q 140 45, 135 32" stroke="#bbf7d0" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Secondary Veins (Right side of midrib) -->
  <path d="M 95 125 Q 120 135, 135 145" stroke="#86efac" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 115 105 Q 140 115, 155 118" stroke="#86efac" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 135 80 Q 152 88, 162 88" stroke="#86efac" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 150 52 Q 160 58, 164 58" stroke="#86efac" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
