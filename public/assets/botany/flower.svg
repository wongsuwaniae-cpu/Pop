<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Flower Anatomy">
  <defs>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="60%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="16" fill="#f8fafc"/>

  <!-- Stem / Pedicel -->
  <path d="M 100 135 L 100 190" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
  <!-- Sepals (Green calyx) -->
  <path d="M 100 145 C 80 155, 60 150, 55 140 C 70 135, 88 135, 100 145 Z" fill="#15803d"/>
  <path d="M 100 145 C 120 155, 140 150, 145 140 C 130 135, 112 135, 100 145 Z" fill="#16a34a"/>

  <!-- Petals (Corolla) - 5 symmetric petals -->
  <!-- Top Petal -->
  <path d="M 100 100 C 80 50, 70 20, 100 20 C 130 20, 120 50, 100 100 Z" fill="url(#petalGrad)" stroke="#be123c" stroke-width="1"/>
  <!-- Top Right Petal -->
  <path d="M 100 100 C 140 70, 175 60, 180 90 C 185 120, 145 120, 100 100 Z" fill="url(#petalGrad)" stroke="#be123c" stroke-width="1"/>
  <!-- Bottom Right Petal -->
  <path d="M 100 100 C 135 135, 160 165, 135 175 C 110 185, 110 145, 100 100 Z" fill="url(#petalGrad)" stroke="#be123c" stroke-width="1"/>
  <!-- Bottom Left Petal -->
  <path d="M 100 100 C 65 135, 40 165, 65 175 C 90 185, 90 145, 100 100 Z" fill="url(#petalGrad)" stroke="#be123c" stroke-width="1"/>
  <!-- Top Left Petal -->
  <path d="M 100 100 C 60 70, 25 60, 20 90 C 15 120, 55 120, 100 100 Z" fill="url(#petalGrad)" stroke="#be123c" stroke-width="1"/>

  <!-- Flower Center (Pistil & Stamens) -->
  <circle cx="100" cy="100" r="24" fill="url(#centerGrad)" stroke="#a16207" stroke-width="2"/>
  
  <!-- Pollen dots / Stamens -->
  <circle cx="92" cy="92" r="3" fill="#713f12"/>
  <circle cx="108" cy="92" r="3" fill="#713f12"/>
  <circle cx="100" cy="100" r="3.5" fill="#854d0e"/>
  <circle cx="92" cy="108" r="3" fill="#713f12"/>
  <circle cx="108" cy="108" r="3" fill="#713f12"/>
</svg>
