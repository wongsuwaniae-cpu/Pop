<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Plant Stem Structure">
  <defs>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="80%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="16" fill="#f8fafc"/>

  <!-- Main Stem Axis -->
  <path d="M 90 190 L 92 15 L 108 15 L 110 190 Z" fill="url(#stemGrad)"/>
  
  <!-- Nodes & Internodes Indicators -->
  <!-- Node 1 (Bottom) -->
  <ellipse cx="100" cy="145" rx="11" ry="3.5" fill="#14532d"/>
  <!-- Branch left -->
  <path d="M 91 145 C 75 140, 55 125, 40 115" stroke="#16a34a" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 40 115 C 30 110, 25 90, 45 95 C 55 98, 50 112, 40 115 Z" fill="#22c55e"/>

  <!-- Node 2 (Middle) -->
  <ellipse cx="100" cy="95" rx="10.5" ry="3" fill="#14532d"/>
  <!-- Branch right -->
  <path d="M 109 95 C 125 90, 145 75, 160 65" stroke="#16a34a" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 160 65 C 170 60, 175 40, 155 45 C 145 48, 150 62, 160 65 Z" fill="#4ade80"/>

  <!-- Node 3 (Top) & Terminal Bud -->
  <ellipse cx="100" cy="45" rx="9.5" ry="2.5" fill="#14532d"/>
  <!-- Branch left top -->
  <path d="M 92 45 C 80 40, 68 30, 60 22" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M 60 22 C 52 18, 50 5, 65 10 C 72 12, 68 20, 60 22 Z" fill="#86efac"/>

  <!-- Apical / Terminal Bud -->
  <path d="M 100 15 C 92 10, 95 0, 100 0 C 105 0, 108 10, 100 15 Z" fill="#86efac"/>
  
  <!-- Vascular lines -->
  <path d="M 98 185 L 98 25 M 102 185 L 102 25" stroke="#166534" stroke-width="1.2" stroke-dasharray="4,3"/>
</svg>
